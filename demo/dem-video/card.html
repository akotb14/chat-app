<!doctype html>
<!--
  Title and end cards for the demo video.

  Rendered to PNG by render-cards.mjs at 1920×1080, then held for a few seconds
  at each end of the footage by edit.mjs. Written in the app's own design
  language — same near-black spine, same single blue→cyan accent, same Josefin
  Sans — so the cards read as part of the product rather than bolted on.

  Open card.html?kind=title or ?kind=end in a browser to preview.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ChatApp — video card</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --night-950: #08080a;
        --night-800: #16171d;
        --fg: #edeff5;
        --fg-muted: #9ba3b4;
        --fg-faint: #666d7d;
        --accent-300: #a5beff;
        --accent-500: #4f7cff;
        --aqua-400: #22d3ee;
      }

      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        position: relative;
        display: grid;
        place-items: center;
        background: var(--night-950);
        color: var(--fg);
        font-family: "Josefin Sans", ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* The mesh. Three blurred blobs, same recipe as the app's hero — colour
         comes from the accent family only, never from the surfaces. */
      .mesh {
        position: absolute;
        inset: -20%;
        filter: blur(120px);
        opacity: 0.5;
      }
      .blob {
        position: absolute;
        border-radius: 50%;
      }
      .b1 {
        width: 46%;
        height: 62%;
        left: 4%;
        top: 6%;
        background: var(--accent-500);
        opacity: 0.55;
      }
      .b2 {
        width: 40%;
        height: 54%;
        right: 6%;
        top: 16%;
        background: var(--aqua-400);
        opacity: 0.32;
      }
      .b3 {
        width: 44%;
        height: 46%;
        left: 28%;
        bottom: 2%;
        background: #6d3bff;
        opacity: 0.34;
      }

      /* Fine grid, barely there — gives the flat black some structure on a
         large screen without ever competing with the type. */
      .grid {
        position: absolute;
        inset: 0;
        background-image: linear-gradient(
            rgba(255, 255, 255, 0.028) 1px,
            transparent 1px
          ),
          linear-gradient(90deg, rgba(255, 255, 255, 0.028) 1px, transparent 1px);
        background-size: 64px 64px;
        mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, #000 30%, transparent 75%);
      }

      .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse 75% 70% at 50% 45%,
          transparent 40%,
          rgba(8, 8, 10, 0.72) 100%
        );
      }

      .stage {
        position: relative;
        text-align: center;
        padding: 0 8rem;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 1.1rem;
        margin-bottom: 3.25rem;
      }
      .logo {
        width: 76px;
        height: 76px;
        border-radius: 22px;
        display: grid;
        place-items: center;
        background: linear-gradient(140deg, var(--accent-500), var(--aqua-400));
        box-shadow: 0 12px 48px -8px rgba(79, 124, 255, 0.6),
          inset 0 1px 0 rgba(255, 255, 255, 0.16);
      }
      .logo svg {
        width: 42px;
        height: 42px;
      }
      .brand span {
        font-size: 46px;
        font-weight: 600;
        letter-spacing: -0.015em;
      }

      h1 {
        font-size: 132px;
        font-weight: 700;
        line-height: 0.94;
        letter-spacing: -0.035em;
      }
      h1 .accent {
        background: linear-gradient(100deg, var(--accent-300), var(--aqua-400));
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .sub {
        margin-top: 2.5rem;
        font-size: 34px;
        font-weight: 300;
        color: var(--fg-muted);
        letter-spacing: 0.005em;
      }

      .stack {
        margin-top: 4rem;
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 0.85rem;
      }
      .chip {
        font-size: 25px;
        font-weight: 400;
        color: var(--fg);
        padding: 0.62rem 1.5rem;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.11);
        background: rgba(22, 23, 29, 0.6);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.09);
      }

      .link {
        margin-top: 4.25rem;
        font-size: 30px;
        font-weight: 400;
        color: var(--accent-300);
        letter-spacing: 0.01em;
      }
      .by {
        margin-top: 1.1rem;
        font-size: 25px;
        font-weight: 300;
        color: var(--fg-faint);
      }

      /* End card runs a little smaller — it is a sign-off, not a headline. */
      body[data-kind="end"] h1 {
        font-size: 104px;
      }
      body[data-kind="end"] .brand {
        margin-bottom: 2.75rem;
      }
    </style>
  </head>
  <body>
    <div class="mesh">
      <div class="blob b1"></div>
      <div class="blob b2"></div>
      <div class="blob b3"></div>
    </div>
    <div class="grid"></div>
    <div class="vignette"></div>

    <div class="stage">
      <div class="brand">
        <span class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
          </svg>
        </span>
        <span>ChatApp</span>
      </div>
      <h1 id="head"></h1>
      <p class="sub" id="sub"></p>
      <div class="stack" id="stack"></div>
      <p class="link" id="link"></p>
      <p class="by" id="by"></p>
    </div>

    <script>
      const COPY = {
        title: {
          head: 'Talk in <span class="accent">real time.</span>',
          sub: "Messages land the instant they are sent — no refresh, no polling.",
          stack: ["React 18", "Tailwind", "Express", "Socket.IO", "MongoDB"],
        },
        end: {
          head: 'Built with <span class="accent">the full stack.</span>',
          sub: "Real-time delivery, bcrypt auth, persisted history, responsive down to mobile.",
          link: "github.com/akotb14/chat-app",
          by: "Ahmed Mohamed Kotb",
        },
      };

      const kind = new URLSearchParams(location.search).get("kind") || "title";
      const c = COPY[kind] || COPY.title;
      document.body.dataset.kind = kind;

      const set = (id, html) => {
        const el = document.getElementById(id);
        if (html) el.innerHTML = html;
        else el.remove();
      };

      set("head", c.head);
      set("sub", c.sub);
      set("link", c.link);
      set("by", c.by);

      if (c.stack) {
        document.getElementById("stack").innerHTML = c.stack
          .map((s) => `<span class="chip">${s}</span>`)
          .join("");
      } else {
        document.getElementById("stack").remove();
      }
    </script>
  </body>
</html>
